<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17202a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icona-192.png"><link rel="apple-touch-icon" href="icona-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Foto Cavalcavia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna da usare con una mano in campo. Testata fissa in alto, elenco difetti
   che scorre, barra di scatto fissa in basso a portata di pollice. Contrasto alto per il sole. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #f6f7f4;
  --ink: #17202a;
  --muted: #5a6571;
  --line: #d6dad4;
  --sel: #1f5fbf;
  --sel-weak: #e2ebf9;
  --hivis: #f2b100;
  --hivis-ink: #1d1600;
  --ok: #1d7a3b;
  --ok-weak: #dff1e5;
  --warn: #875400;
  --warn-weak: #fff0cc;
  --bad: #b3261e;
  --bad-weak: #fbe6e4;
  --head: #17202a;
  --head-ink: #f2f4f1;
  --f-disp: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", Roboto, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "Roboto Mono", ui-monospace, monospace;
  --r: 10px;
  --barra-h: 132px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #19212a; --surface-2: #141b22; --ink: #e9eef2; --muted: #9ba7b3; --line: #2b3540;
    --sel: #79a8ff; --sel-weak: #1b2b44; --hivis: #f2b100; --hivis-ink: #1d1600;
    --ok: #63c787; --ok-weak: #16301f; --warn: #f2bd60; --warn-weak: #382a10; --bad: #ff8c80; --bad-weak: #3b1b18;
    --head: #0a0e12; --head-ink: #e9eef2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #19212a; --surface-2: #141b22; --ink: #e9eef2; --muted: #9ba7b3; --line: #2b3540;
  --sel: #79a8ff; --sel-weak: #1b2b44; --hivis: #f2b100; --hivis-ink: #1d1600;
  --ok: #63c787; --ok-weak: #16301f; --warn: #f2bd60; --warn-weak: #382a10; --bad: #ff8c80; --bad-weak: #3b1b18;
  --head: #0a0e12; --head-ink: #e9eef2; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img.rotta { visibility: hidden; }
.form-drive { display: flex; gap: 8px; margin-top: 8px; }
.briciole { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin: 0 0 12px; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.briciole b { color: var(--ink); font-weight: 600; }
.briciole .link { padding: 0; }
.elenco-cart { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.riga-cart { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 14px; min-height: 48px; }
.riga-cart:first-child { border-top: 0; }
.riga-cart span:first-child { overflow-wrap: anywhere; min-width: 0; }
.form-drive input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }   /* anteprima che il telefono non sa mostrare (es. HEIC su Android): riquadro vuoto, non icona rotta */
/* testi lunghi senza spazi (nomi, descrizioni, note) vanno a capo invece di allargare la pagina */
.app, .nome, .meta, .ds, .v, .nota, .dest-lista span, .pannello b, .pannello .sp, .toast .t, .prec-riga .t, .etich,
.vuoto-home, .avviso, .passi li span, .parte .t, .opz span, p.sp, .conferma span, .riga-prog span { overflow-wrap: anywhere; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f-body); -webkit-tap-highlight-color: transparent; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- testata ---------- */
header.testa { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--head); color: var(--head-ink); }
.testa-in { display: flex; align-items: center; gap: 10px; padding-block: 10px; min-height: 58px; }
.indietro { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: inherit; font-size: 22px; line-height: 1; display: grid; place-items: center; }
.testa-tit { flex: 1; min-width: 0; }
.testa-tit .app { font: 700 18px/1.1 var(--f-disp); letter-spacing: .01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.testa-tit .sub { font: 500 13px/1.25 var(--f-disp); color: #b8c2cc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 10px; font: 600 12px/1 var(--f-disp); letter-spacing: .02em; border: 0; background: rgba(255,255,255,.1); color: inherit; }
.pill .pt { width: 8px; height: 8px; border-radius: 50%; background: #9aa5b0; }
.pill.ok .pt { background: #5fd38a; }
.pill.attesa .pt { background: var(--hivis); }
.pill.errore .pt { background: #ff6b5e; }
.pill.lavora .pt { animation: pulsa 1s infinite alternate; }
@keyframes pulsa { from { opacity: 1; } to { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.lavora .pt { animation: none; } }

main { padding-block: 14px calc(var(--barra-h) + env(safe-area-inset-bottom, 0px) + 20px); }
main.home { padding-bottom: 40px; }
.avviso { border-radius: var(--r); padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.avviso.warn { background: var(--warn-weak); color: var(--warn); }
.avviso.bad { background: var(--bad-weak); color: var(--bad); }
.avviso.info { background: var(--sel-weak); color: var(--ink); }
.avviso b { font-weight: 600; }

/* ---------- home ---------- */
h2.sez { font: 700 13px/1 var(--f-disp); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 22px 0 10px; }
h2.sez:first-child { margin-top: 4px; }
.sez-riga { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 10px; }
.sez-riga h2.sez { margin: 0; }
.sez-riga:first-child { margin-top: 4px; }
.link { border: 0; background: none; padding: 6px 0 6px 10px; color: var(--sel); font: 600 14px/1 var(--f-disp); }
.gest { display: grid; gap: 10px; }
.gest-isp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.gest-isp .nome { font: 700 17px/1.15 var(--f-disp); }
.gest-isp .meta { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.gest-isp .meta b { color: var(--ink); font-weight: 600; }
.gest-isp .meta .att { color: var(--warn); font-weight: 600; }
.gest-isp .bt { display: flex; gap: 8px; flex-wrap: wrap; }
.lista-isp { display: grid; gap: 10px; }
.card-isp { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.card-isp .nome { font: 700 19px/1.15 var(--f-disp); }
.card-isp .meta { font-size: 13px; color: var(--muted); }
.barra-prog { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.barra-prog > i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.riga-prog { display: flex; justify-content: space-between; gap: 10px; font: 500 13px/1.2 var(--f-disp); color: var(--muted); }
.riga-prog b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.vuoto-home { background: var(--surface); border: 1.5px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--muted); }
.vuoto-home b { color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-decoration: none; }
.btn.prim { background: var(--sel); border-color: var(--sel); color: #fff; }
.btn.blocco { width: 100%; }
.btn.picc { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn.peric { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.passi { counter-reset: p; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.passi li { counter-increment: p; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; font-size: 14px; }
.passi li::before { content: counter(p); width: 28px; height: 28px; border-radius: 50%; background: var(--head); color: var(--head-ink); display: grid; place-items: center; font: 700 14px/1 var(--f-disp); }
.passi b { font-weight: 600; }
.piede { margin-top: 18px; font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }

/* ---------- ispezione ---------- */
.riepilogo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; margin-bottom: 12px; }
.riepilogo .r1 { display: flex; align-items: center; gap: 10px; }
.riepilogo .r1 .riga-prog { flex: 1; }
.strumenti { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.strumenti input[type=search] { flex: 1; min-width: 0; height: 46px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 16px; }
.chip { flex: none; height: 46px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font: 600 14px/1 var(--f-disp); }
.chip[aria-pressed="true"] { background: var(--sel-weak); border-color: var(--sel); color: var(--sel); }

.gruppo { margin-bottom: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.g-testa { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px; border: 0; background: var(--surface-2); text-align: left; border-bottom: 1px solid var(--line); }
.g-testa .gn { flex: 1; font: 700 16px/1.1 var(--f-disp); letter-spacing: .01em; }
.g-testa .gc { font: 500 13px/1 var(--f-mono); color: var(--muted); }
.g-testa .fr { color: var(--muted); width: 16px; text-align: center; }
.gruppo.chiuso .g-testa { border-bottom: 0; }
.comp { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
.comp .cn { flex: 1; font: 600 13px/1.2 var(--f-disp); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.comp .tutti { border: 0; background: none; color: var(--sel); font: 600 13px/1 var(--f-disp); padding: 6px 0 6px 8px; }
.dif { width: 100%; display: grid; grid-template-columns: 28px 1fr auto auto; align-items: center; gap: 4px 10px; padding: 10px 12px; min-height: 58px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.comp + .dif { border-top: 0; }
.dif .ck { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; font: 700 16px/1 var(--f-body); }
.dif[aria-pressed="true"] { background: var(--sel-weak); }
.dif[aria-pressed="true"] .ck { background: var(--sel); border-color: var(--sel); color: #fff; }
.dif .tx { min-width: 0; }
.dif .id { font: 500 12px/1 var(--f-mono); color: var(--muted); display: block; margin-bottom: 3px; }
.dif .ds { font-weight: 500; font-size: 15px; line-height: 1.25; display: block; }
.dif .nt { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.dif .dx { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.g { font: 700 11px/1 var(--f-mono); border-radius: 4px; padding: 3px 5px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.g.g3 { background: var(--warn-weak); color: var(--warn); border-color: transparent; }
.g.g4, .g.g5 { background: var(--bad-weak); color: var(--bad); border-color: transparent; }
.nf { font: 600 12px/1 var(--f-mono); border-radius: 999px; padding: 5px 8px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.nf.si { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
.pv { display: block; width: 56px; height: 42px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.pv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pv.mia { border: 2px solid var(--ok); }
.prec-riga { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); }
.prec-riga .t { flex: 1; min-width: 0; }
.prec-riga b { color: var(--ink); font-weight: 600; }
.prec-foto { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: #000; margin-bottom: 14px; position: relative; }
.prec-foto img { display: block; width: 100%; max-height: 46vh; object-fit: contain; }
.prec-foto .st { position: absolute; left: 8px; top: 8px; font: 600 12px/1 var(--f-disp); padding: 5px 8px; border-radius: 999px; background: rgba(0,0,0,.65); color: #fff; }
.vista .etich { font: 600 12px/1 var(--f-disp); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); }
.nuovo-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.nuovo-form input { flex: 1; min-width: 0; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; font-size: 16px; }
.niente { padding: 24px 12px; text-align: center; color: var(--muted); }

/* ---------- barra di scatto ---------- */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.08); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.barra .info { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: 13.5px; color: var(--muted); margin-bottom: 8px; }
.barra .info .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra .info b { color: var(--ink); }
.barra .info .x { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.barra .az { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.scatta { min-height: 58px; border-radius: 12px; border: 0; background: var(--hivis); color: var(--hivis-ink); font: 700 19px/1 var(--f-disp); letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.scatta:disabled, .galleria:disabled { opacity: .4; }
.galleria { min-height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font: 600 15px/1.1 var(--f-disp); }
.ico-cam { width: 26px; height: 22px; }
input.nascosto { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* ---------- avvisi temporanei ---------- */
.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--barra-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 40; background: var(--head); color: var(--head-ink); border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; flex: none; background: #333; }
.toast .t { flex: 1; min-width: 0; font-size: 14px; }
.toast .t b { display: block; font-weight: 600; }
.toast button { flex: none; border: 1px solid rgba(255,255,255,.3); background: transparent; color: inherit; border-radius: 8px; padding: 8px 10px; font-weight: 600; white-space: nowrap; }
main.home ~ .toast { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

/* ---------- fogli (dettaglio, foto, esporta) ---------- */
.foglio { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); }
.foglio .f-testa { background: var(--head); color: var(--head-ink); }
.foglio .f-corpo { flex: 1; overflow-y: auto; padding-block: 14px calc(24px + env(safe-area-inset-bottom, 0px)); }
.scheda { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; margin-bottom: 14px; }
.scheda .k { font: 500 12px/1 var(--f-mono); color: var(--muted); }
.scheda .v { font-size: 15px; }
.scheda .nota { font-size: 14px; color: var(--muted); white-space: pre-wrap; }
.griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.miniatura { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; border: 0; padding: 0; background: var(--surface-2); }
.miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
.miniatura .st { position: absolute; left: 5px; bottom: 5px; font: 600 10.5px/1 var(--f-disp); padding: 3px 6px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; }
.vista { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.vista .img { flex: 1; min-height: 0; display: grid; place-items: center; }
.vista .img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.vista .pannello { background: var(--surface); color: var(--ink); border-radius: 14px 14px 0 0; padding-top: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; max-height: 50%; overflow-y: auto; }
.dest-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.dest-lista li { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.dest-lista li span { flex: 1; min-width: 0; }
.conferma { background: var(--bad-weak); color: var(--bad); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.conferma .bt { display: flex; gap: 8px; flex-wrap: wrap; }
.parti { display: grid; gap: 8px; }
.parte { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.parte .t { flex: 1; min-width: 0; font-size: 14px; }
.parte .t b { display: block; font: 600 15px/1.2 var(--f-disp); }
.parte.fatta { border-color: var(--ok); }
.opz { display: grid; gap: 8px; margin-bottom: 12px; }
.opz label { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; font-size: 14px; }
.opz input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--sel); }
.progresso { height: 10px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.progresso > i { display: block; height: 100%; width: 0; background: var(--sel); transition: width .2s; }
p.sp { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
@media (min-width: 760px) {
  .contenuto { max-width: 720px; margin: 0 auto; }
  .barra .az, .barra .info { max-width: 720px; margin-left: auto; margin-right: auto; }
  .toast { left: 50%; right: auto; width: min(720px, calc(100% - 32px)); transform: translateX(-50%); }
}
</style>

<header class="testa"><div class="testa-in gutter contenuto" id="testa"></div></header>
<main id="main" class="gutter"><div class="contenuto" id="vista"></div></main>
<div class="barra gutter" id="barra" hidden></div>
<input type="file" id="inCamera" class="nascosto" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="inGalleria" class="nascosto" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<input type="file" id="inElenco" class="nascosto" accept=".xlsx,.csv,.pdf,text/csv,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple tabindex="-1" aria-hidden="true">

<script>
"use strict";
/* =====================================================================
   Foto ARGO - scatta le foto dei difetti e le assegna gia' in campo.
   Dati: IndexedDB del telefono (subito) + spazio online dell'app (db + assets)
   quando c'e' campo. Esporta pacchetti ZIP per il PC (importa_telefono.py).
   ===================================================================== */

const VERSIONE = "18 (25/10)";
const LIMITE_PARTE = 180 * 1024 * 1024;     // sotto i 200 MB dell'app Claude per Android
const LIMITE_ASSET = 20 * 1024 * 1024;
const TIPI_ONLINE = ["image/jpeg", "image/png", "image/webp", "image/gif"];
const CHIAVE_GENERALI = "_FOTO_GENERALI";
const PREF_NUOVO = "_NUOVI_DIFETTI/";

const S = {
  isp: new Map(),        // id -> ispezione
  foto: new Map(),       // id -> foto
  aperta: null,          // id ispezione aperta
  sel: new Set(),        // chiavi destinazione selezionate
  cerca: "",
  soloSenza: false,
  chiusi: new Set(),
  locale: true,          // IndexedDB disponibile
  cap: { db: null, assets: null, downloads: null },
  cloud: "attesa",       // attesa | ok | assente
  sync: { inCorso: false, errore: "", prossimo: 0 },
  miniUrl: new Map(),
  prec: new Map(),       // id ispezione -> { info, foto: Map(id difetto -> foto dell'ultima ispezione) }
  precUrl: new Map(),
  vistaPrec: null,       // chiave del difetto di cui si vede la foto precedente
  gest: null,            // foglio "Ispezioni caricate": { conferma: id ispezione da eliminare }
  autonoma: false,       // aperta fuori da claude.ai: tutto resta sul telefono (o va sul Drive collegato)
  drive: null,           // { url, cartella, proprietario }: Drive collegato (solo versione autonoma)
  base: "",              // dove stanno i dati online: "" per il proprietario, "data/users/<id>/archivio/" per chi è invitato
  senzaSpazio: false,    // invitato senza uno spazio online personale: tutto resta sul telefono
  ruolo: "",             // proprietario | invitato (per la pagina «Stato dell'app»)
  statoAperto: false,    // pagina «Stato dell'app» aperta
};
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------------- utilita' ---------------- */
function nomeCartella(testo, max = 60) {
  let s = String(testo || "").replace(/[\/\\]/g, "-").replace(/[:*?"<>|]/g, "-").replace(/[\x00-\x1f]/g, " ");
  s = s.replace(/\s+/g, " ").trim();
  s = s.slice(0, max).replace(/[ .]+$/, "");
  return s || "SENZA_NOME";
}
function naturale(a, b) { return String(a).localeCompare(String(b), "it", { numeric: true, sensitivity: "base" }); }
function nuovoId() { return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n, l = 2) { return String(n).padStart(l, "0"); }
function timbro(d) { return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; }
function mb(b) { return b >= 1048576 ? (b / 1048576).toFixed(b >= 10485760 ? 0 : 1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
function oraBreve(iso) { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function vibra() { try { navigator.vibrate && navigator.vibrate(25); } catch (e) {} }

/* ---------------- archivio sul telefono (IndexedDB) ---------------- */
let _idb = null;
function apriLocale() {
  if (!_idb) _idb = new Promise((ok, ko) => {
    let r;
    try { r = indexedDB.open("argo-foto", 2); } catch (e) { ko(e); return; }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("foto")) d.createObjectStore("foto", { keyPath: "id" });
      if (!d.objectStoreNames.contains("ispezioni")) d.createObjectStore("ispezioni", { keyPath: "id" });
      if (!d.objectStoreNames.contains("prec")) d.createObjectStore("prec", { keyPath: "id" });
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
  return _idb;
}
function _fine(t) { return new Promise((ok, ko) => { t.oncomplete = () => ok(); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); }); }
async function lPut(store, val) {
  if (!S.locale) return;
  try { const d = await apriLocale(); const t = d.transaction(store, "readwrite"); t.objectStore(store).put(val); await _fine(t); }
  catch (e) { segnalaLocale(e); }
}
async function lDel(store, key) {
  if (!S.locale) return;
  try { const d = await apriLocale(); const t = d.transaction(store, "readwrite"); t.objectStore(store).delete(key); await _fine(t); }
  catch (e) { segnalaLocale(e); }
}
async function lScrivi(store, metti, togli) {
  if (!S.locale) return;
  try {
    const d = await apriLocale(); const t = d.transaction(store, "readwrite"), os = t.objectStore(store);
    for (const k of togli || []) os.delete(k);
    for (const v of metti || []) os.put(v);
    await _fine(t);
  } catch (e) { segnalaLocale(e); }
}
async function lTutti(store) {
  const d = await apriLocale();
  return new Promise((ok, ko) => { const r = d.transaction(store).objectStore(store).getAll(); r.onsuccess = () => ok(r.result || []); r.onerror = () => ko(r.error); });
}
function segnalaLocale(e) { console.warn("archivio locale", e); if (S.locale) { S.locale = false; disegna(); } }

function fotoPerLocale(f) {
  const { id, isp, nome, scattata, dest, blob, thumb, size, tipo, asset, esportata, sync, creata, galleria } = f;
  return { id, isp, nome, scattata, dest, blob, thumb, size, tipo, asset: asset || null, esportata: !!esportata, sync, creata, galleria: !!galleria,
    convertita: !!f.convertita, sizeOnline: f.sizeOnline || 0, soloTelefono: !!f.soloTelefono, motivo: f.motivo || "", formato: f.formato || "",
    fallimenti: f.fallimenti || 0, inConversione: !!f.inConversione,
    drive: f.drive || null, driveFile: f.driveFile || "", driveNome: f.driveNome || "", driveCartella: f.driveCartella || "", driveUrl: f.driveUrl || "", driveRadice: f.driveRadice || "", driveDest: f.driveDest || "" };
}
// scrive la foto sul telefono solo se c'e' ancora (non riportare in vita una foto appena eliminata)
async function salvaLocale(f) { if (S.foto.get(f.id) === f && f.locale) await lPut("foto", fotoPerLocale(f)); }
function fotoPerCloud(f) {
  // se online c'e' una copia JPEG (originale HEIC o simile), nome e tipo online sono quelli della copia
  const conv = !!f.convertita;
  return { isp: f.isp, nome: conv ? String(f.nome || "foto").replace(/\.[^.]*$/, "") + ".jpg" : f.nome, scattata: f.scattata, dest: f.dest, size: conv ? (f.sizeOnline || f.size) : f.size, tipo: conv ? "image/jpeg" : (f.tipo || "image/jpeg"), asset: f.asset || null, esportata: !!f.esportata, creata: f.creata || f.scattata || null };
}
function ispPerCloud(i) {
  const doc = { ispezione: i.ispezione, opera: i.opera, cartella: i.cartella, difetti: i.difetti, nuovi: i.nuovi || [], aggiornata: i.aggiornata || new Date().toISOString() };
  if (i.prec) doc.prec = i.prec;   // foto dell'ultima ispezione: { caricato, odl, data, file, n, foto: { difetto: [asset, dataFoto, idFoto, ispezione] } }
  if (JSON.stringify(doc).length > 240000) doc.difetti = i.difetti.map(({ note, ...resto }) => resto);
  return doc;
}

async function caricaLocale() {
  try {
    const [isp, foto] = await Promise.all([lTutti("ispezioni"), lTutti("foto")]);
    for (const i of isp) S.isp.set(i.id, i);
    try { for (const r of await lTutti("prec")) mettiPrec(r); } catch (e) { console.warn("foto precedenti", e); }
    for (const f of foto) {
      S.foto.set(f.id, Object.assign(f, { locale: !!f.blob }));
      if (f.inConversione) { f.inConversione = false; f.soloTelefono = true; f.motivo = "conversione interrotta: il telefono si è chiuso o bloccato"; lPut("foto", fotoPerLocale(f)).catch(() => {}); }
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { segnalaLocale(e); }
}

/* ---------------- spazio online (db + assets) ---------------- */
let _stopIsp = null, _stopFoto = null;
async function collegaOnline() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") {
    S.cloud = "assente"; S.autonoma = true; avviaAutonoma();
    S.drive = leggiDrive();
    const dalLink = urlScript(location.hash);
    if (dalLink) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
    disegna();
    if (dalLink && (!S.drive || S.drive.url !== dalLink)) collegaDrive(dalLink);
    else if (S.drive) { sincronizza(); aggiornaInfoDrive(true); }
    return;
  }
  let [db, assets, downloads, user] = await Promise.all([c.use("db"), c.use("assets"), c.use("downloads"), c.use("user")].map((p) => p.catch(() => null)));
  // Ognuno ha il suo archivio online: il proprietario dell'app usa le raccolte di sempre (visibili solo a lui),
  // chi è stato invitato usa il proprio spazio privato data/users/<id>/, che nessun altro vede.
  if (db && user) {
    let proprietario = true, id = null;
    try { proprietario = await user.isOwner(); } catch (e) {}
    S.ruolo = proprietario ? "proprietario" : "invitato";
    if (!proprietario) {
      try { id = await user.id(); } catch (e) {}
      if (id) S.base = "data/users/" + id + "/archivio/";
      else { db = null; assets = null; S.senzaSpazio = true; }
    }
  }
  S.cap = { db, assets, downloads };
  S.cloud = db ? "ok" : "assente";
  if (db) {
    _stopIsp = db.collection(S.base + "ispezioni").onSnapshot(suSnapIsp, (e) => erroreOnline(e));
    _stopFoto = db.collection(S.base + "foto").onSnapshot(suSnapFoto, (e) => erroreOnline(e));
  }
  disegna();
  sincronizza();
}
/* Fuori da claude.ai (app messa su un sito qualsiasi): niente spazio online, le foto restano sul telefono
   finche' non si esportano. Se accanto alla pagina ci sono sw.js e manifest.webmanifest, l'app si apre anche
   senza campo e si installa come app ("Aggiungi a schermata Home"). */
function avviaAutonoma() {
  try { document.title = "Foto Cavalcavia"; } catch (e) {}
  try {
    if (!document.querySelector('link[rel="manifest"]')) {
      const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l);
    }
    if ("serviceWorker" in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  } catch (e) {}
}
function erroreOnline(e) { S.sync.errore = (e && e.code) || "errore"; disegnaTesta(); }

function suSnapIsp(snap) {
  for (const ch of snap.docChanges()) {
    const id = ch.doc.id, d = ch.doc.data();
    const loc = S.isp.get(id);
    if (ch.type === "removed") {
      if (loc && loc.sync === "ok") { S.isp.delete(id); lDel("ispezioni", id); }
      continue;
    }
    if (!loc || loc.sync === "ok") {
      const nuova = Object.assign({ id, sync: "ok" }, JSON.parse(JSON.stringify(d)));
      S.isp.set(id, nuova); lPut("ispezioni", nuova);
    }
  }
  disegna();
  allineaPrec();
}
/* Foto dell'ultima ispezione caricate su un altro dispositivo (es. il PDF aperto dal PC): qui arrivano solo i
   riferimenti alle immagini online, che si vedono direttamente da "/_blob/<id>". Niente PDF da riscaricare. */
let _allineaPrec = false;
async function allineaPrec() {
  if (_allineaPrec) return;
  _allineaPrec = true;
  let cambiate = false;
  try {
    for (const i of [...S.isp.values()]) {
      const o = i.prec;
      if (!o || !o.caricato || !o.foto || i.sync === "del") continue;
      const loc = S.prec.get(i.id), info = loc && loc.info;
      if (info && info.caricato >= o.caricato) continue;   // gia' uguale, o qui c'e' un PDF piu' recente da mettere online
      const vecchi = togliPrecMemoria(i.id);
      const togli = vecchi ? [...vecchi.foto.values()].map((r) => r.id).concat(vecchi.info ? [vecchi.info.id] : []) : [];
      const nuovi = Object.entries(o.foto).map(([dif, v]) => ({ id: i.id + "|" + dif, isp: i.id, difetto: dif, asset: v[0], dataFoto: v[1] || "", idFoto: v[2] || "", ispezione: v[3] || "" }));
      nuovi.push({ id: i.id + "|_info", isp: i.id, difetto: "_info", odl: o.odl || "", data: o.data || "", opera: i.opera || "", file: o.file || "", n: o.n || nuovi.length, caricato: o.caricato, online: o.caricato });
      for (const r of nuovi) mettiPrec(r);
      await lScrivi("prec", nuovi, togli.filter((k) => !nuovi.some((r) => r.id === k)));
      cambiate = true;
    }
  } finally { _allineaPrec = false; }
  if (cambiate) disegna();
}
function suSnapFoto(snap) {
  for (const ch of snap.docChanges()) {
    const id = ch.doc.id, d = ch.doc.data();
    const f = S.foto.get(id);
    if (ch.type === "removed") {
      if (f && (!f.locale || f.sync === "ok")) { S.foto.delete(id); lDel("foto", id); }
      continue;
    }
    const dati = JSON.parse(JSON.stringify(d));
    if (!f) S.foto.set(id, Object.assign({ id, locale: false, sync: "ok" }, dati));
    else if (!f.locale) Object.assign(f, dati);
    else if (f.sync === "ok") { f.dest = dati.dest; f.esportata = dati.esportata; f.asset = dati.asset || f.asset; lPut("foto", fotoPerLocale(f)); }
  }
  disegna();
}

/* Foto la cui scheda non c'e' (o e' in eliminazione) su questo dispositivo: senza scheda non si vedono e non si
   esportano. Ricaricando il report di quell'ispezione la scheda torna con lo stesso numero e le foto ci si riattaccano. */
function fotoSenzaScheda() {
  const g = new Map();
  for (const f of S.foto.values()) {
    if (f.sync === "del") continue;
    const i = S.isp.get(f.isp);
    if (i && i.sync !== "del") continue;
    const k = f.isp || "?";
    if (!g.has(k)) g.set(k, { isp: k, tot: 0, soloQui: 0, online: 0 });
    const r = g.get(k); r.tot++;
    if (f.locale && f.sync !== "ok") r.soloQui++; else r.online++;
  }
  return [...g.values()].sort((a, b) => naturale(a.isp, b.isp));
}
function htmlSenzaScheda() {
  const lista = fotoSenzaScheda();
  if (!lista.length) return "";
  let h = `<h2 class="sez">Foto senza scheda</h2><div class="avviso warn"><b>Ci sono foto di ispezioni la cui scheda non è su questo dispositivo.</b> Per vederle ed esportarle tocca «Ricarica il report» e scegli il report «Riepilogo difetti Livello 1» di quell'ispezione: la scheda torna con le foto già assegnate ai difetti.</div><div class="gest" style="margin-top:10px">`;
  for (const r of lista) {
    h += `<div class="gest-isp"><div class="nome">Ispezione ${esc(r.isp)}</div><div class="meta"><span><b>${r.tot}</b> ${r.tot === 1 ? "foto" : "foto"}${r.online ? ` · ${r.online} salvate online` : ""}${r.soloQui ? ` · <span class="att">${r.soloQui} solo su questo dispositivo</span>` : ""}</span></div>` +
      `<div class="bt"><button class="btn picc" data-ricarica="${esc(r.isp)}">Ricarica il report</button></div></div>`;
  }
  return h + `</div>`;
}

function daCaricare() {
  let n = 0;
  for (const f of S.foto.values()) if (f.locale && f.sync !== "ok" && !f.soloTelefono) n++;
  if (S.drive && S.autonoma) { for (const i of S.isp.values()) if (i.sync !== "del" && !ispFattaDrive(i)) n++; return n; }
  for (const i of S.isp.values()) if (i.sync !== "ok") n++;
  if (S.cap.assets) for (const id of S.prec.keys()) if (precDaInviare(id)) n++;
  return n;
}

/* ---------------- foto che lo spazio online non accetta ----------------
   Lo spazio online accetta JPEG, PNG, WebP e GIF e controlla il contenuto del file, non solo il tipo dichiarato dal
   telefono. Prima di caricare si legge il formato vero dai primi byte; un HEIC (o altro formato che il telefono sa
   aprire) va online come copia JPEG, l'originale resta intatto sul telefono. Se non si riesce, la foto resta solo sul
   telefono (si esporta lo stesso per il PC), il motivo si vede in «Stato dell'app» e non blocca le altre foto.
   Errori che riguardano tutto (spazio pieno, troppe richieste, accesso) fermano il giro e si riprova piu' tardi. */
const ERR_FILE = ["unsupported_type", "too_large"];
const ERR_GLOBALI = ["quota_or_state", "quota_exceeded", "resource_exhausted", "rate_limited", "upstream_auth", "not_granted", "capability_disabled",
  "capability_removed", "store_unavailable", "unavailable", "revoked", "permission_denied", "forbidden", "unauthenticated"];
const MAX_FALLIMENTI = 3;
async function formatoReale(blob) {
  try {
    if (!blob || !blob.size) return "vuoto";
    const b = new Uint8Array(await blob.slice(0, 32).arrayBuffer());
    if (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return "image/jpeg";
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return "image/png";
    const s = String.fromCharCode(...b);
    if (s.startsWith("RIFF") && s.slice(8, 12) === "WEBP") return "image/webp";
    if (s.startsWith("GIF8")) return "image/gif";
    if (s.slice(4, 8) === "ftyp") {   // contenitore ISO: la «marca» dice se e' una foto HEIC/AVIF o un video
      const marca = s.slice(8, 12);
      if (/^(heic|heix|heim|heis|hevc|hevx|hevm|hevs|mif1|mif2|msf1)$/.test(marca)) return "image/heic";
      if (/^avi[fs]$/.test(marca)) return "image/avif";
      return "video";
    }
    if (s.startsWith("II*\0") || s.startsWith("MM\0*")) return "image/tiff";
    if (s.startsWith("BM")) return "image/bmp";
    if (s.startsWith("%PDF")) return "pdf";
    if (/^(\xef\xbb\xbf)?\s*</.test(s)) return "testo";
    return "sconosciuto";
  } catch (e) { return "illeggibile"; }
}
function nomeFormato(t) {
  return { "image/jpeg": "JPEG", "image/png": "PNG", "image/webp": "WebP", "image/gif": "GIF", "image/heic": "HEIC", "image/avif": "AVIF", "image/tiff": "TIFF", "image/bmp": "BMP", video: "video", pdf: "PDF", testo: "non immagine", vuoto: "file vuoto", illeggibile: "file non leggibile", sconosciuto: "sconosciuto" }[t] || t || "?";
}
async function inJpeg(blob) {
  let src = null, url = "", c = null;
  try {
    try { src = await createImageBitmap(blob, { imageOrientation: "from-image" }); }   // foto verticali restano verticali
    catch (e) {
      url = URL.createObjectURL(blob);
      src = await new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ko(new Error("immagine non decodificabile")); im.src = url; });
    }
    const w0 = src.naturalWidth || src.width, h0 = src.naturalHeight || src.height;
    if (!w0 || !h0) throw new Error("immagine vuota");
    const k = Math.min(1, Math.sqrt(16e6 / (w0 * h0)));   // i telefoni non disegnano oltre ~16 Mpx
    const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d");
    if (!g) throw new Error("memoria del telefono insufficiente");
    g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);          // le parti trasparenti vengono bianche, non nere
    g.drawImage(src, 0, 0, w, h);
    let out = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.92));
    if (out && out.size > LIMITE_ASSET) out = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.8));
    if (!out || !out.size) throw new Error("conversione non riuscita");
    return out;
  } finally {
    if (src && src.close) src.close();
    if (url) URL.revokeObjectURL(url);
    if (c) c.width = c.height = 0;                         // libera subito la memoria (iPhone)
  }
}
// copia JPEG tenuta in memoria finche' non e' online (nessuna nuova conversione a ogni tentativo).
// Prima di convertire si segna sul telefono: se l'app si chiude durante la conversione, al riavvio non riprova da sola.
async function copiaJpeg(f) {
  if (f._jpeg) return f._jpeg;
  f.inConversione = true; await salvaLocale(f);
  try { f._jpeg = await inJpeg(f.blob); return f._jpeg; }
  finally { f.inConversione = false; await salvaLocale(f); }
}
async function rifiuta(f, motivo) { f.soloTelefono = true; f.motivo = motivo; f._jpeg = null; await salvaLocale(f); return "qui"; }
const codiceErrore = (e) => (e && typeof e.code === "string" && e.code) || "errore";
// esito: "ok" (online) | "qui" (resta sul telefono) | "errore" (riprova piu' tardi) | "eliminata"; lancia per gli errori globali
async function caricaFoto(assets, f) {
  const reale = await formatoReale(f.blob);
  f.formato = reale;
  if (["illeggibile", "vuoto", "testo", "video", "pdf"].includes(reale)) return rifiuta(f, nomeFormato(reale));
  const daConvertire = !TIPI_ONLINE.includes(reale) || f.blob.size > LIMITE_ASSET;
  let blob = f.blob, tipo = reale;
  if (daConvertire) {

  else if (f.blob) u = URL.createObjectURL(f.blob);
  else if (f.asset) u = "/_blob/" + f.asset;
  if (u) S.miniUrl.set(f.id, u);
  return u;
}
function urlGrande(f) { return f.blob ? URL.createObjectURL(f.blob) : f.asset ? "/_blob/" + f.asset : ""; }
function liberaMini(id) { const u = S.miniUrl.get(id); if (u && u.startsWith("blob:")) URL.revokeObjectURL(u); S.miniUrl.delete(id); }

/* ---------------- scatto e salvataggio ---------------- */
async function salvaFoto(file, daCamera) {
  const isp = S.isp.get(S.aperta);
  if (!isp || !S.sel.size) return null;
  const ora = new Date();
  const quando = daCamera ? ora : (await dataExif(file)) || new Date(file.lastModified || ora);
  const est = (/\.([a-z0-9]{3,4})$/i.exec(file.name || "") || [, "jpg"])[1].toLowerCase();
  const nome = daCamera ? `IMG_${timbro(quando)}_${Math.random().toString(36).slice(2, 5)}.${est === "jpeg" ? "jpg" : est}` : (file.name || `IMG_${timbro(quando)}.${est}`);
  const f = {
    id: nuovoId(), isp: isp.id, nome, scattata: quando.toISOString(), dest: [...S.sel],
    blob: file, thumb: await miniatura(file), size: file.size, tipo: file.type || "image/jpeg",
    asset: null, esportata: false, sync: "nuova", creata: ora.toISOString(), locale: true,
  };
  S.foto.set(f.id, f);
  await lPut("foto", fotoPerLocale(f));
  return f;
}
async function suScatto(input, daCamera) {
  const files = [...(input.files || [])];
  input.value = "";
  if (!files.length) return;
  const salvate = [];
  for (const file of files) { const f = await salvaFoto(file, daCamera); if (f) salvate.push(f); }
  if (!salvate.length) { mostraToast("<b>Foto non salvata</b>Nessun difetto spuntato: spunta prima uno o più difetti e poi scatta.", null, 5000); return; }
  vibra();
  // dopo lo scatto le spunte si tolgono da sole e non esce nessun messaggio: la foto compare accanto al difetto.
  // Per un'altra foto si rispunta il difetto; una foto sbagliata si elimina aprendola.
  S.sel.clear();
  const n = salvate[0].dest.length;
  if (!S.locale) mostraToast(`<b>Foto tenuta solo in memoria</b>Questo telefono non permette di salvarla: esportala prima di chiudere l'app.`, salvate[0], 5000);
  else if (!daCamera) mostraToast(`<b>${salvate.length === 1 ? "Foto aggiunta" : salvate.length + " foto aggiunte"}</b>in ${n === 1 ? "1 difetto" : n + " difetti"}`, salvate[0], 2500);
  disegna();
  sincronizza();
  if (daCamera && galleriaAttiva() && puoiSalvare()) copiaInGalleria(salvate.map((f) => f.id));
}
/* ---------------- copia nella galleria del telefono ----------------
   Una pagina web non può scrivere nella galleria: salva una copia come file scaricato (cartella Download),
   che la galleria mostra nell'album «Download». Su claude.ai ogni salvataggio chiede conferma. */
function galleriaAttiva() { try { return localStorage.getItem("argo-galleria") === "1"; } catch (e) { return false; } }
function puoiSalvare() { return !!S.cap.downloads || (S.autonoma && window.top === window); }
const _codaGalleria = []; let _galleriaInCorso = false;
function copiaInGalleria(ids) { for (const id of ids) if (!_codaGalleria.includes(id)) _codaGalleria.push(id); lavoraGalleria(); }
async function lavoraGalleria() {
  if (_galleriaInCorso) return;
  _galleriaInCorso = true;
  let tentativi = 0;
  try {
    while (_codaGalleria.length) {
      const f = S.foto.get(_codaGalleria[0]);
      if (!f || f.sync === "del" || f.galleria) { _codaGalleria.shift(); continue; }
      const nome = String(f.nome || "foto.jpg").replace(/\.(jpeg|jfif)$/i, ".jpg");
      try {
        const blob = await blobDi(f);
        if (S.cap.downloads) await S.cap.downloads.save({ filename: nome, data: blob });
        else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
        f.galleria = true; tentativi = 0;
        if (f.locale) await lPut("foto", fotoPerLocale(f));
        _codaGalleria.shift();
      } catch (e) {
        const c = e && e.code;
        if (c === "rate_limited" && tentativi++ < 5) { await new Promise((ok) => setTimeout(ok, 4000)); continue; }
        _codaGalleria.shift(); tentativi = 0;
        if (c === "declined") mostraToast("<b>Copia nella galleria annullata</b>Puoi farla dopo aprendo la foto.", null, 3500);
        else if (c === "rejected_extension") mostraToast("<b>Questo formato non si può copiare nella galleria</b>" + esc(nome), null, 4000);
        else mostraToast("<b>Copia nella galleria non riuscita</b>" + esc((e && e.message) || ""), null, 4000);
      }
    }
  } finally {
    _galleriaInCorso = false;
    if (S.vista) disegnaFotoGrande();
    if (S.esp) disegnaEsporta();
  }
}

async function eliminaFoto(id, silenzioso) {
  const f = S.foto.get(id); if (!f) return;
  if (!f.asset && !f.drive && f.sync === "nuova") { S.foto.delete(id); await lDel("foto", id); liberaMini(id); }
  else {
    f.sync = "del"; f.dest = [];
    await lPut("foto", fotoPerLocale(f));
    sincronizza();
  }
  if (!silenzioso) disegna();
}
async function cambiaDest(id, dest) {
  const f = S.foto.get(id); if (!f) return;
  f.dest = dest;
  if (f.locale) { if (f.sync === "ok") f.sync = "mod"; await lPut("foto", fotoPerLocale(f)); sincronizza(); }
  else if (S.cap.db) { try { await S.cap.db.doc(S.base + "foto/" + id).update({ dest }); } catch (e) { mostraToast("<b>Modifica non salvata</b>Serve la connessione per modificare questa foto."); } }
}

/* ---------------- calcoli ---------------- */
function fotoDi(ispId) { return [...S.foto.values()].filter((f) => f.isp === ispId && f.sync !== "del"); }
// ultima foto scattata per ogni difetto (per la miniatura a fianco del difetto)
function ultimeFoto(ispId) {
  const ult = new Map();
  for (const f of fotoDi(ispId)) for (const k of f.dest) { const u = ult.get(k); if (!u || String(f.scattata) > String(u.scattata)) ult.set(k, f); }
  return ult;
}
function conteggi(ispId) {
  const per = new Map();
  for (const f of fotoDi(ispId)) for (const k of f.dest) per.set(k, (per.get(k) || 0) + 1);
  return per;
}
function destinazioni(isp) {
  const out = isp.difetti.map((d) => ({ ...d, key: d.id, genere: "difetto" }));
  out.push({ key: CHIAVE_GENERALI, genere: "generali", parte: "ALTRO", componente: "", descrizione: "Foto generali dell'opera", id: "" });
  for (const n of isp.nuovi || []) out.push({ key: PREF_NUOVO + n, genere: "nuovo", parte: "ALTRO", componente: "NUOVI DIFETTI", descrizione: n, id: "" });
  return out;
}
function etichetta(isp, key) {
  if (key === CHIAVE_GENERALI) return "Foto generali";
  if (key.startsWith(PREF_NUOVO)) return "Nuovo: " + key.slice(PREF_NUOVO.length);
  const d = isp.difetti.find((x) => x.id === key);
  return d ? `${d.componente} · ${d.id}` : key;
}
function etichettaLunga(isp, key) {
  if (key === CHIAVE_GENERALI) return "Foto generali dell'opera";
  if (key.startsWith(PREF_NUOVO)) return "Nuovo difetto: " + key.slice(PREF_NUOVO.length);
  const d = isp.difetti.find((x) => x.id === key);
  return d ? `${d.parte} › ${d.componente} › ${d.id} ${d.descrizione}` : key;
}

/* Le pagine si ridisegnano quando arrivano aggiornamenti online: chi sta scrivendo (ricerca, nome del nuovo
   difetto) non deve perdere il testo ne' la tastiera. */
function conservaCampi(contenitore, ridisegna) {
  const att = document.activeElement;
  const idAtt = att && att.id && contenitore.contains(att) ? att.id : null;
  const sel = idAtt && typeof att.selectionStart === "number" ? [att.selectionStart, att.selectionEnd] : null;
  const nn = document.getElementById("nuovoNome"), testo = nn && contenitore.contains(nn) ? nn.value : "";
  ridisegna();

  if (nn2 && testo) nn2.value = testo;
  if (idAtt) {
    const e = document.getElementById(idAtt);
    if (e && document.activeElement !== e) { try { e.focus({ preventScroll: true }); if (sel && e.setSelectionRange) e.setSelectionRange(sel[0], sel[1]); } catch (x) {} }
  }
}

  if (ev.target.id !== "formNuovo") return;
  ev.preventDefault();
  const isp = S.isp.get(S.aperta), nome = nomeCartella($("#nuovoNome").value, 70);
  if (!isp || !$("#nuovoNome").value.trim()) return;
  $("#nuovoNome").value = ""; $("#nuovoNome").blur();
  isp.nuovi = [...new Set([...(isp.nuovi || []), nome])];
  isp.sync = "mod"; isp.aggiornata = new Date().toISOString();
  S.sel = new Set([PREF_NUOVO + nome]);   // subito, prima di qualsiasi attesa: lo scatto successivo va qui
  disegna();
  await lPut("ispezioni", isp);
  sincronizza();
  mostraToast(`<b>Nuovo difetto creato</b>Ora è l'unico spuntato: scatta le sue foto.`);
});

/* ---------------- avvio ---------------- */
(async function avvio() {
  disegna();
  await caricaLocale();
  try { const a = localStorage.getItem("argo-aperta"); if (a && S.isp.has(a)) S.aperta = a; } catch (e) {}
  disegna();
  collegaOnline();
})();
</script>
